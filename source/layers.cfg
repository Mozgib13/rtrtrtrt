// layers.cfg — Terrain Builder layer definitions for the Krasnoyarsk map.
// Maps mask COLORS of source/satmask.png to real vanilla DayZ surface materials.
// All texture paths below exist in the vanilla DayZ P: drive (copied from the
// stock Chernarus "CP" set and Livonia "Bliss" set — they ship with DayZ Tools).
// Do NOT invent new paths; if you swap a layer, take the path from an existing file.
//
// IMPORTANT: colours in the <Legend> section MUST match source/satmask.png exactly.

class Layers
{
	// grass — meadows / lawns (Chernarus grass)
	class cp_grass
	{
		texture = "DZ\surfaces\data\terrain\cp_grass_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_grass.rvmat";
	};

	// dry steppe grass (Livonia stubble — yellow-brown field look)
	class en_stubble
	{
		texture = "DZ\surfaces_bliss\data\terrain\en_stubble_ca.paa";
		material = "DZ\surfaces_bliss\data\terrain\en_stubble.rvmat";
	};

	// dirt — dirt roads, pit floors
	class cp_dirt
	{
		texture = "DZ\surfaces\data\terrain\cp_dirt_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_dirt.rvmat";
	};

	// asphalt — roads / bridges / runway (old worn tarmac)
	class en_tarmac_old
	{
		texture = "DZ\surfaces_bliss\data\terrain\en_tarmac_old_ca.paa";
		material = "DZ\surfaces_bliss\data\terrain\en_tarmac_old.rvmat";
	};

	// concrete — city blocks & pads (Chernarus concrete 1)
	class cp_concrete1
	{
		texture = "DZ\surfaces\data\terrain\cp_concrete1_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_concrete1.rvmat";
	};

	// sand — shoreline / beaches (Chernarus sparse broadleaf, sandy tone)
	class cp_broadleaf_sparse1
	{
		texture = "DZ\surfaces\data\terrain\cp_broadleaf_sparse1_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_broadleaf_sparse1.rvmat";
	};

	// rock — Stolby crags (Chernarus rock)
	class cp_rock
	{
		texture = "DZ\surfaces\data\terrain\cp_rock_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_rock.rvmat";
	};

	// forest — coniferous (taiga) floor, mossy (Chernarus conifer moss)
	class cp_conifer_moss1
	{
		texture = "DZ\surfaces\data\terrain\cp_conifer_moss1_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_conifer_moss1.rvmat";
	};

	// gravel — industrial yards & rail bed (Chernarus gravel)
	class cp_gravel
	{
		texture = "DZ\surfaces\data\terrain\cp_gravel_ca.paa";
		material = "DZ\surfaces\data\terrain\cp_gravel.rvmat";
	};
};

class Legend
{
  picture = "Krasnoyarsk\source\maplegend.png";
  class Colors
  {
		cp_grass[] = {{0,255,0}};
		en_stubble[] = {{240,230,60}};
		cp_dirt[] = {{150,75,0}};
		en_tarmac_old[] = {{60,60,60}};
		cp_concrete1[] = {{170,170,170}};
		cp_broadleaf_sparse1[] = {{235,220,160}};
		cp_rock[] = {{128,100,90}};
		cp_conifer_moss1[] = {{0,120,60}};
		cp_gravel[] = {{110,110,130}};
  };
};
